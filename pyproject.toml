[project]
name = "synthetic-data-fabricator"
version = "1.0.0"
description = "A Developer Efficiency Agent that fabricates synthetic SAP test data using Google ADK"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.5.0",
    "flask>=3.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "faker>=28.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["mock_sap_server*", "synthetic_data_agent*"]
